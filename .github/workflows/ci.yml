name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  research:
    name: Python (research)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes stoned_mango spike tests
      - run: pytest -q

  web:
    name: Web (typecheck, Python parity, build, browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The browser engine must reproduce the Python engine on shared/golden (Essentia.js + ONNX Runtime Web in Node);
      # key codes, exports and the key-tag writer (shared/golden/tags, read back by mutagen in the Python job).
      - run: npm test
      - run: npm run build
      # The built app in headless Chromium: WAV, MP3 (WebCodecs) and FLAC (fallback) give Python's answers,
      # nothing touches the network while files are analysed, the interface and key tags work, and it works offline.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
