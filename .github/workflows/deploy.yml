name: Deploy

# Builds the site from this repository's public source and publishes it to Cloudflare Pages:
# pushes to main go live; pushes to any other branch get their own preview link (handy for
# testing on a phone). It needs two repository secrets, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (how to make them: docs/phase7/REPORT.md). Until they exist, the
# workflow stops after a one-line notice.
#
# The build (npm ci, tests, vite) runs without the secrets. Only the publish job can use them,
# and it runs nothing but Wrangler, from its own lockfile (.github/deploy) and without install
# scripts, so a compromised build dependency can't reach the Cloudflare token.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Cloudflare credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not published: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish the site."
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The built site is public anyway; kept for a day, for the publish job
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'stoned-mango' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/deploy
          persist-credentials: false
      # No npm cache in this job: nothing the build job wrote is reused here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler (locked, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/deploy
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
      # Secrets pasted into GitHub's form can carry a stray space or line break, which Cloudflare
      # rejects ("Invalid account ID"), so both are trimmed before use. Wrangler's messages go
      # through `hide`: after a login error it prints the account's email address, and this
      # repository's logs are public.
      - name: Create the Pages project (first time only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          hide() { sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<email hidden>/g'; }
          wrangler() { .github/deploy/node_modules/.bin/wrangler "$@"; }
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          projects="$(wrangler pages project list 2>&1)" || { printf '%s\n' "$projects" | hide; exit 1; }
          if ! grep -qw "$PROJECT" <<< "$projects"; then
            wrangler pages project create "$PROJECT" --production-branch=main 2>&1 | hide
          fi
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          hide() { sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<email hidden>/g'; }
          wrangler() { .github/deploy/node_modules/.bin/wrangler "$@"; }
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          wrangler pages deploy "$RUNNER_TEMP/site" --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" --commit-hash="$GITHUB_SHA" 2>&1 | hide
